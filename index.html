<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Configurazione PWA per iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fotocamera">
  <link rel="apple-touch-icon" href="./camera-icon.jpg?v=4">
  <title>Fotocamera</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    /* Specchia il video e il canvas AR per la fotocamera frontale */
    #ar-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      transform: scaleX(-1);
      z-index: 1;
    }

    .a-enter-vr, .a-enter-ar, .mindar-ui-overlay, .mindar-ui-loading, .mindar-ui-scanning {
      display: none !important;
    }

    /* Interfaccia Fotocamera iOS */
    #ios-camera-ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }

    .top-bar {
      width: 100%;
      height: 110px;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 24px 14px 24px;
      color: #fff;
      pointer-events: auto;
    }

    .icon-circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
    }

    .viewfinder-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 18px;
    }

    .zoom-pill {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffd60a;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: color 0.15s ease;
    }

    .bottom-bar {
      width: 100%;
      height: 195px;
      background: rgba(0, 0, 0, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 14px;
      pointer-events: auto;
    }

    .modes-carousel {
      display: flex;
      gap: 22px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.6px;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 24px;
    }

    .modes-carousel .active-mode {
      color: #ffd60a;
    }

    .shutter-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 34px;
    }

    .gallery-thumb {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2c2c2e, #1c1c1e);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .shutter-outer {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      border: 4px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .shutter-inner {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: #fff;
      transition: transform 0.1s ease;
    }

    .shutter-outer:active .shutter-inner {
      transform: scale(0.9);
    }

    .flip-camera-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 22px;
    }
  </style>
</head>
<body>

  <!-- Contenitore AR (Specchiato) -->
  <div id="ar-wrapper">
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind?v=4; autoStart: false; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 4; warmupTolerance: 2;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: false, alpha: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0: La Regina di Cuori fisica -->
      <a-entity id="card-target" mindar-image-target="targetIndex: 0">
        <!--
          scale="-1 1 1" raddrizza l'immagine specchiata.
          side: double evita che il piano diventi nero o invisibile quando viene girato.
        -->
        <a-plane
          id="fake-card-overlay"
          position="0 0 0"
          height="1.42"
          width="1.02"
          scale="-1 1 1"
          material="src: ./6_fiori.jpg; shader: flat; side: double; transparent: true; opacity: 0.96;">
        </a-plane>
      </a-entity>

    </a-scene>
  </div>

  <!-- Interfaccia Fotocamera iOS -->
  <div id="ios-camera-ui">
    <!-- Barra Superiore (Doppio tap qui per resettare il trucco) -->
    <div class="top-bar" id="secret-reset-zone">
      <div class="icon-circle">⚡</div>
      <div class="icon-circle">⌃</div>
      <div class="icon-circle">◎</div>
    </div>

    <div class="viewfinder-area">
      <div class="zoom-pill" id="debug-pill">1x</div>
    </div>

    <!-- Barra Inferiore (Tap qui per forzare la sparizione manuale) -->
    <div class="bottom-bar" id="manual-trigger-zone">
      <div class="modes-carousel">
        <span>CINEMA</span>
        <span>VIDEO</span>
        <span class="active-mode">FOTO</span>
        <span>RITRATTO</span>
        <span>PANO</span>
      </div>
      <div class="shutter-row">
        <div class="gallery-thumb"></div>
        <div class="shutter-outer">
          <div class="shutter-inner"></div>
        </div>
        <div class="flip-camera-btn">↻</div>
      </div>
    </div>
  </div>

  <script>
    // 1. Forza l'uso della fotocamera frontale
    const origGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
    navigator.mediaDevices.getUserMedia = function(constraints) {
      if (constraints && constraints.video) {
        constraints.video = {
          facingMode: 'user',
          width: { ideal: 1280 },
          height: { ideal: 720 }
        };
      }
      return origGetUserMedia(constraints);
    };

    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector('a-scene');
      const targetEl = document.querySelector('#card-target');
      const overlayEl = document.querySelector('#fake-card-overlay');
      const manualZone = document.querySelector('#manual-trigger-zone');
      const resetZone = document.querySelector('#secret-reset-zone');
      const debugPill = document.querySelector('#debug-pill');

      let trickCompleted = false;
      let targetDetectedTime = 0;
      let isTracking = false;

      // 2. Rilevamento automatico del file del 6 di Fiori (qualunque sia l'estensione su GitHub)
      const possibleFiles = [
        './6_fiori.jpg', './6_fiori.JPG',
        './6_fiori.jpeg', './6_fiori.JPEG',
        './6_fiori.png', './6_fiori.PNG'
      ];
      possibleFiles.forEach(fileUrl => {
        const testImg = new Image();
        const cacheBusterUrl = fileUrl + '?v=4';
        testImg.onload = () => {
          overlayEl.setAttribute('material', {
            src: cacheBusterUrl,
            shader: 'flat',
            side: 'double',
            transparent: true,
            opacity: 0.96
          });
        };
        testImg.src = cacheBusterUrl;
      });

      // Avvia MindAR
      sceneEl.addEventListener("renderstart", () => {
        const arSystem = sceneEl.systems["mindar-image-system"];
        if (arSystem) arSystem.start();
      });

      // Quando la fotocamera riconosce la Donna di Cuori
      targetEl.addEventListener("targetFound", () => {
        if (trickCompleted) return;
        isTracking = true;
        targetDetectedTime = Date.now();
        overlayEl.setAttribute('visible', 'true');
        // Spia discreta: il testo "1x" diventa leggermente bianco quando aggancia la carta
        debugPill.style.color = '#ffffff';
      });

      // Quando passi la mano davanti alla fotocamera
      targetEl.addEventListener("targetLost", () => {
        debugPill.style.color = '#ffd60a';
        if (trickCompleted || !isTracking) return;
        isTracking = false;

        const visibleDuration = Date.now() - targetDetectedTime;
        if (visibleDuration > 800) {
          vanishOverlay();
        }
      });

      function vanishOverlay() {
        trickCompleted = true;
        overlayEl.setAttribute('visible', 'false');
        if (navigator.vibrate) navigator.vibrate(20);
      }

      // Trigger manuale sulla barra inferiore
      manualZone.addEventListener('touchstart', () => {
        if (!trickCompleted) {
          vanishOverlay();
        }
      });

      // Reset segreto con doppio tap sulla barra superiore
      let lastTap = 0;
      resetZone.addEventListener('touchend', () => {
        const now = Date.now();
        if (now - lastTap < 350) {
          trickCompleted = false;
          isTracking = false;
          overlayEl.setAttribute('visible', 'true');
        }
        lastTap = now;
      });
    });
  </script>
</body>
</html>
