<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Configurazione PWA per iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fotocamera">
  <link rel="apple-touch-icon" href="./camera-icon.jpg?v=5">
  <title>Fotocamera</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    #ar-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      transform: scaleX(-1);
      z-index: 1;
    }

    .a-enter-vr, .a-enter-ar, .mindar-ui-overlay, .mindar-ui-loading, .mindar-ui-scanning {
      display: none !important;
    }

    #ios-camera-ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }

    .top-bar {
      width: 100%;
      height: 110px;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 24px 14px 24px;
      color: #fff;
      pointer-events: auto;
      touch-action: none;
    }

    .icon-circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
    }

    .viewfinder-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 18px;
    }

    .zoom-pill {
      min-width: 38px;
      height: 38px;
      padding: 0 8px;
      border-radius: 19px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffd60a;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: color 0.15s ease;
    }

    .bottom-bar {
      width: 100%;
      height: 195px;
      background: rgba(0, 0, 0, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 14px;
      pointer-events: auto;
      touch-action: none;
    }

    .modes-carousel {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 22px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.6px;
      color: rgba(255, 255, 255, 0.55);
      padding-bottom: 24px;
    }

    .modes-carousel .active-mode {
      color: #ffd60a;
    }

    .shutter-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 34px;
    }

    .gallery-thumb {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2c2c2e, #1c1c1e);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .shutter-outer {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      border: 4px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shutter-inner {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: #fff;
    }

    .flip-camera-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 22px;
    }
  </style>
</head>
<body>

  <!-- Contenitore AR (Specchiato) -->
  <div id="ar-wrapper">
    <!-- warmupTolerance: 0 fa apparire la carta istantaneamente al primo frame -->
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind?v=5; autoStart: false; warmupTolerance: 0; missTolerance: 5; filterMinCF: 0.01; filterBeta: 50;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: false, alpha: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <img id="six-card-tex" src="./6_fiori.jpg?v=5" crossorigin="anonymous" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0: La Regina di Cuori fisica -->
      <a-entity id="card-target" mindar-image-target="targetIndex: 0">
        <a-plane
          id="fake-card-overlay"
          src="#six-card-tex"
          position="0 0 0"
          height="1.42"
          width="1.02"
          scale="-1 1 1"
          material="shader: flat; side: double; transparent: true; opacity: 0.98;">
        </a-plane>
      </a-entity>

    </a-scene>
  </div>

  <!-- Interfaccia Fotocamera iOS -->
  <div id="ios-camera-ui">
    <!-- Barra Superiore:
         - Doppio tap: Resetta il trucco
         - Scorri il dito a sinistra/destra: Regola tonalità Fredda/Calda della carta -->
    <div class="top-bar" id="top-bar-zone">
      <div class="icon-circle">⚡</div>
      <div class="icon-circle">⌃</div>
      <div class="icon-circle">◎</div>
    </div>

    <div class="viewfinder-area">
      <div class="zoom-pill" id="debug-pill">1x</div>
    </div>

    <!-- Barra Inferiore:
         - Scorri il dito su FOTO/VIDEO: Regola la luminosità della carta
         - Tocca la riga del pulsante di scatto: Sparizione manuale immediata -->
    <div class="bottom-bar">
      <div class="modes-carousel" id="brightness-slider-zone">
        <span>CINEMA</span>
        <span>VIDEO</span>
        <span class="active-mode">FOTO</span>
        <span>RITRATTO</span>
        <span>PANO</span>
      </div>
      <div class="shutter-row" id="manual-trigger-zone">
        <div class="gallery-thumb"></div>
        <div class="shutter-outer">
          <div class="shutter-inner"></div>
        </div>
        <div class="flip-camera-btn">↻</div>
      </div>
    </div>
  </div>

  <script>
    // 1. Risoluzione ottimizzata per velocizzare il riconoscimento a 60fps
    const origGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
    navigator.mediaDevices.getUserMedia = function(constraints) {
      if (constraints && constraints.video) {
        constraints.video = {
          facingMode: 'user',
          width: { ideal: 960 },
          height: { ideal: 540 },
          frameRate: { ideal: 60 }
        };
      }
      return origGetUserMedia(constraints);
    };

    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector('a-scene');
      const targetEl = document.querySelector('#card-target');
      const overlayEl = document.querySelector('#fake-card-overlay');
      const manualZone = document.querySelector('#manual-trigger-zone');
      const topBarZone = document.querySelector('#top-bar-zone');
      const brightnessZone = document.querySelector('#brightness-slider-zone');
      const debugPill = document.querySelector('#debug-pill');

      let trickCompleted = false;
      let targetDetectedTime = 0;
      let isTracking = false;

      // Valori salvati di Luminosità (0.3 - 1.0) e Calore/Giallo (0.0 - 0.5)
      let cardBrightness = parseFloat(localStorage.getItem('cardBrightness') || '0.82');
      let cardWarmth = parseFloat(localStorage.getItem('cardWarmth') || '0.12');
      let pillTimeout = null;

      // Calcola e applica il colore esatto sulla carta
      function updateCardTone(showIndicator = false) {
        const r = Math.min(255, Math.round(255 * cardBrightness));
        const g = Math.min(255, Math.round(255 * cardBrightness * (1 - cardWarmth * 0.28)));
        const b = Math.min(255, Math.round(255 * cardBrightness * (1 - cardWarmth * 0.65)));
        const hexColor = '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
        
        overlayEl.setAttribute('material', 'color', hexColor);

        if (showIndicator) {
          debugPill.textContent = `${Math.round(cardBrightness * 100)}%`;
          clearTimeout(pillTimeout);
          pillTimeout = setTimeout(() => { debugPill.textContent = '1x'; }, 900);
        }
      }

      updateCardTone(false);

      // Caricamento automatico del file immagine (qualunque estensione abbia)
      ['./6_fiori.jpg', './6_fiori.JPG', './6_fiori.jpeg', './6_fiori.png'].forEach(fileUrl => {
        const img = new Image();
        const url = fileUrl + '?v=5';
        img.onload = () => {
          overlayEl.setAttribute('material', 'src', url);
          updateCardTone(false);
        };
        img.src = url;
      });

      sceneEl.addEventListener("renderstart", () => {
        const arSystem = sceneEl.systems["mindar-image-system"];
        if (arSystem) arSystem.start();
      });

      targetEl.addEventListener("targetFound", () => {
        if (trickCompleted) return;
        isTracking = true;
        targetDetectedTime = Date.now();
        overlayEl.setAttribute('visible', 'true');
        debugPill.style.color = '#ffffff';
      });

      targetEl.addEventListener("targetLost", () => {
        debugPill.style.color = '#ffd60a';
        if (trickCompleted || !isTracking) return;
        isTracking = false;

        if (Date.now() - targetDetectedTime > 650) {
          vanishOverlay();
        }
      });

      function vanishOverlay() {
        trickCompleted = true;
        overlayEl.setAttribute('visible', 'false');
        if (navigator.vibrate) navigator.vibrate(20);
      }

      // Sparizione manuale toccando la zona del pulsante di scatto
      manualZone.addEventListener('touchstart', () => {
        if (!trickCompleted) vanishOverlay();
      });

      // SLIDER SEGRETO 1: Scorri il dito su "CINEMA VIDEO FOTO..." per regolare la LUMINOSITÀ
      let startXBright = 0;
      let initialBright = cardBrightness;
      brightnessZone.addEventListener('touchstart', (e) => {
        startXBright = e.touches[0].clientX;
        initialBright = cardBrightness;
      });
      brightnessZone.addEventListener('touchmove', (e) => {
        const delta = (e.touches[0].clientX - startXBright) / window.innerWidth;
        cardBrightness = Math.max(0.25, Math.min(1.0, initialBright + delta));
        localStorage.setItem('cardBrightness', cardBrightness.toFixed(2));
        updateCardTone(true);
      });

      // SLIDER SEGRETO 2: Scorri il dito sulla barra superiore per regolare la TONALITÀ (Fredda <-> Calda)
      // + Doppio tap sulla barra superiore per resettare il trucco
      let startXWarm = 0;
      let initialWarm = cardWarmth;
      let lastTap = 0;

      topBarZone.addEventListener('touchstart', (e) => {
        startXWarm = e.touches[0].clientX;
        initialWarm = cardWarmth;
      });
      topBarZone.addEventListener('touchmove', (e) => {
        const delta = (e.touches[0].clientX - startXWarm) / window.innerWidth;
        cardWarmth = Math.max(0.0, Math.min(0.6, initialWarm + delta));
        localStorage.setItem('cardWarmth', cardWarmth.toFixed(2));
        updateCardTone(true);
      });
      topBarZone.addEventListener('touchend', () => {
        const now = Date.now();
        if (now - lastTap < 350) {
          trickCompleted = false;
          isTracking = false;
          overlayEl.setAttribute('visible', 'true');
        }
        lastTap = now;
      });
    });
  </script>
</body>
</html>
